<!doctype html>
<!-- What imperfect.app shows while its machine starts (desktop/electron/mac.mjs). -->
<html><head><meta charset="utf-8"><title>imperfect</title><style>
html,body{margin:0;height:100%;background:#000;color:#d8d8dc;font:13px/1.4 -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;-webkit-user-select:none;-webkit-app-region:drag;overflow:hidden}
main{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
img{width:96px;height:96px}
p{margin:0;letter-spacing:.02em}
.dots::after{content:'';animation:dots 1.4s steps(4) infinite}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
</style></head><body><main><img src="icon-1024.png" alt=""><p class="dots">Starting imperfect</p></main></body></html>
